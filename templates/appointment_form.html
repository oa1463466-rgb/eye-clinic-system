{% extends "base.html" %}{% block content %}
<div class="section"><h2>📅 حجز موعد</h2><p>{{patient.full_name}} — {{patient.file_no}}</p></div>
<form method="post" class="section"><div class="form-grid">
<div class="field"><label>التاريخ</label><input type="date" name="appointment_date" required></div>
<div class="field"><label>الوقت</label><input type="time" name="appointment_time" required></div>
<div class="field full"><label>سبب الزيارة</label><input name="reason"></div>
</div><br><button class="btn success">حفظ الموعد</button> <a class="btn secondary" href="{{url_for('patient_detail',patient_id=patient.id)}}">إلغاء</a></form>{% endblock %}
